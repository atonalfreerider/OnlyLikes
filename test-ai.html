<!DOCTYPE html>
<head>
    <title>OnlyLikes AI Test</title>
    <style>
        body { font-family: monospace; margin: 20px; }
        button { padding: 10px; margin: 10px 0; }
        pre { background: #f0f0f0; padding: 10px; white-space: pre-wrap; }
        .error { color: red; }
        .success { color: green; }
        .warning { color: orange; }
    </style>
</head>
<body>
    <h1>OnlyLikes AI API Test (Updated for Chrome 138+)</h1>
    <button id="testBtn">Test LanguageModel API</button>
    <button id="clearBtn">Clear Results</button>
    <pre id="results">Click "Test LanguageModel API" to run diagnostics...</pre>
    
    <script>
        document.getElementById('clearBtn').onclick = function() {
            document.getElementById('results').textContent = 'Results cleared.\n';
        };
        
        document.getElementById('testBtn').onclick = async function() {
            const results = document.getElementById('results');
            results.textContent = 'Running LanguageModel API diagnostics...\n\n';
            
            function log(message, type = 'info') {
                const prefix = type === 'error' ? '❌ ' : type === 'success' ? '✅ ' : type === 'warning' ? '⚠️ ' : 'ℹ️ ';
                results.textContent += `${prefix}${message}\n`;
            }
            
            try {
                // Basic environment checks
                log('=== ENVIRONMENT CHECKS ===');
                log(`User Agent: ${navigator.userAgent}`);
                
                const chromeMatch = navigator.userAgent.match(/Chrome\/(\d+)/);
                const chromeVersion = chromeMatch ? parseInt(chromeMatch[1]) : 0;
                log(`Chrome Version: ${chromeVersion}`);
                
                if (chromeVersion < 138) {
                    log(`Chrome ${chromeVersion} is below required version 138`, 'error');
                    log('Please update Chrome to version 138 or later');
                    return;
                } else {
                    log(`Chrome version ${chromeVersion} meets requirements`, 'success');
                }
                
                log(`Extension ID: ${chrome.runtime.id}`);
                log(`Current URL: ${window.location.href}`);
                
                // New LanguageModel API checks
                log('\n=== LANGUAGEMODEL API CHECKS ===');
                log(`LanguageModel available: ${typeof globalThis.LanguageModel !== 'undefined'}`);
                
                if (typeof globalThis.LanguageModel !== 'undefined') {
                    log('LanguageModel API found', 'success');
                    
                    try {
                        log('\nTesting availability...');
                        const availability = await LanguageModel.availability();
                        log(`Availability: ${availability}`);
                        
                        if (availability === 'available') {
                            log('Model is ready for immediate use', 'success');
                        } else if (availability === 'downloadable') {
                            log('Model will be available after download', 'warning');
                        } else if (availability === 'downloading') {
                            log('Model is currently downloading', 'warning');
                        } else if (availability === 'unavailable') {
                            log('Model is not available', 'error');
                            log('Check: Storage space (22GB+), GPU VRAM (4GB+), network connection');
                            return;
                        }
                        
                        log('\nTesting model parameters...');
                        const params = await LanguageModel.params();
                        log(`Model params: ${JSON.stringify(params)}`);
                        
                        log('\nCreating LanguageModel session...');
                        const session = await LanguageModel.create({
                            monitor(m) {
                                m.addEventListener('downloadprogress', (e) => {
                                    log(`Download progress: ${Math.round(e.loaded * 100)}%`);
                                });
                            }
                        });
                        log('Session created successfully', 'success');
                        
                        log('\nTesting sentiment analysis...');
                        const testComment = "This is awesome! Great work everyone!";
                        const prompt = `Analyze the sentiment of this comment and rate it from 0.0 (very negative) to 1.0 (very positive). Respond with only the number.\n\nComment: "${testComment}"`;
                        
                        const response = await session.prompt(prompt);
                        log(`AI Response: "${response}"`);
                        
                        // Parse response
                        const numberMatch = response.trim().match(/\b(0(?:\.\d+)?|1(?:\.0+)?)\b/);
                        if (numberMatch) {
                            const sentiment = parseFloat(numberMatch[0]);
                            log(`Parsed sentiment: ${sentiment}`, 'success');
                            log(`Test ${testComment.includes('awesome') ? 'PASSED' : 'NEEDS_REVIEW'}: Positive comment should have high sentiment score`);
                        } else {
                            log(`Could not parse sentiment from: "${response}"`, 'warning');
                        }
                        
                        // Test session usage
                        log(`\nSession usage: ${session.inputUsage}/${session.inputQuota} tokens`);
                        
                        session.destroy();
                        log('Session destroyed', 'success');
                        
                        log('\n=== TEST COMPLETE ===', 'success');
                        log('LanguageModel API is working properly!', 'success');
                        
                    } catch (error) {
                        log(`LanguageModel API Error: ${error.message}`, 'error');
                        log(`Error stack: ${error.stack}`);
                    }
                } else {
                    log('LanguageModel API not available', 'error');
                    log('This indicates:');
                    log('- Chrome version is below 138');
                    log('- Hardware requirements not met (22GB storage, 4GB+ VRAM)');
                    log('- System/OS not supported');
                    log('- Extension is not properly loaded');
                }
                
                // Background script communication test
                log('\n=== BACKGROUND SCRIPT TEST ===');
                try {
                    chrome.runtime.sendMessage({
                        action: "analyzeComment",
                        comment: "This is a fantastic test comment!",
                        hash: "test_hash_123"
                    }, (response) => {
                        if (chrome.runtime.lastError) {
                            log(`Background script error: ${chrome.runtime.lastError.message}`, 'error');
                        } else {
                            log(`Background response: ${JSON.stringify(response)}`, 'success');
                            if (response && typeof response.sentiment === 'number') {
                                log(`Sentiment analysis working: ${response.sentiment}`, 'success');
                            }
                        }
                    });
                } catch (error) {
                    log(`Message sending error: ${error.message}`, 'error');
                }
                
            } catch (error) {
                log(`Main test error: ${error.message}`, 'error');
                log(`Stack trace: ${error.stack}`);
            }
        };
        
        // Auto-run test on load
        window.onload = function() {
            document.getElementById('testBtn').click();
        };
    </script>
</body>
</html>
